name: Release

# Builds Pejla and attaches Pejla-<version>.dmg, Pejla-<version>.zip and
# checksums to a GitHub release. It runs when:
#   - a release is published on GitHub (Releases > Draft a new release),
#   - a tag starting with "v" is pushed,
#   - it is started by hand from the Actions tab with a tag or version.
# Tags may be written v1.2.0, v.1.2.0 or 1.2.0; the version becomes 1.2.0.

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag or version to build (v1.2.0, v.1.2.0 or 1.2.0). An existing tag is reused, otherwise v<version> is created from the chosen branch."
        required: true

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the version and tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$EVENT" in
            release) raw="$RELEASE_TAG" ;;
            workflow_dispatch) raw="$INPUT" ;;
            *) raw="$GITHUB_REF_NAME" ;;
          esac
          version="$(printf '%s' "$raw" | sed -E 's/^[vV]\.?//')"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Cannot work out a version number from '$raw'" >&2
            exit 1
          fi
          create_tag=false
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if git rev-parse -q --verify "refs/tags/$raw" >/dev/null; then
              tag="$raw"
            elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              tag="v$version"
            else
              tag="v$version"
              create_tag=true
            fi
            if [[ "$create_tag" == "false" ]]; then
              echo "Building the code at existing tag $tag"
              git checkout -q "refs/tags/$tag"
            fi
          else
            tag="$raw"
          fi
          echo "Version $version, tag $tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Test
        run: swift test

      - name: Build app bundle
        env:
          PEJLA_VERSION: ${{ steps.version.outputs.version }}
          PEJLA_BUILD: ${{ github.run_number }}
        run: Scripts/build-app.sh

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 Pejla-*.dmg Pejla-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          echo "$TAG -> $GITHUB_SHA"

      - name: Publish release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; attaching the build to it."
          else
            cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install on a Mac

          1. Download **Pejla-$VERSION.dmg** below.
          2. Open it and drag **Pejla** into **Applications**.
          3. The first launch needs one extra step because the app is not notarised with Apple. The steps are in the [README](https://github.com/$GITHUB_REPOSITORY#first-launch).

          NOTES
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Pejla $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/Pejla-*.dmg dist/Pejla-*.zip dist/SHA256SUMS.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
