name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (a tag v<version> is created)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Work out the version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="$GITHUB_REF_NAME"
          fi
          # Accept v1.2.0, v.1.2.0 or 1.2.0 and normalise to 1.2.0.
          version="$(printf '%s' "$raw" | sed -E 's/^[vV]\.?//')"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Cannot work out a version number from '$raw'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: swift test

      - name: Build app bundle
        env:
          PEJLA_VERSION: ${{ steps.version.outputs.version }}
          PEJLA_BUILD: ${{ github.run_number }}
        run: Scripts/build-app.sh

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 Pejla-*.dmg Pejla-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.version.outputs.tag }}"
          git push -f origin "${{ steps.version.outputs.tag }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install on a Mac

          1. Download **Pejla-$VERSION.dmg** below.
          2. Open it and drag **Pejla** into **Applications**.
          3. The first launch needs one extra step because the app is not notarised with Apple. The steps are in the [README](https://github.com/$GITHUB_REPOSITORY#first-launch).

          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Pejla $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Pejla $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/Pejla-*.dmg dist/Pejla-*.zip dist/SHA256SUMS.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
